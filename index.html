<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Progreso de Construcción</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos personalizados */
        body {
            font-family: 'Inter', sans-serif;
            display: flex; /* Usar flexbox para layout principal */
            min-height: 100vh; /* Asegurar que el body ocupe al menos toda la altura */
            flex-direction: column; /* Apilar header, content, footer verticalmente */
        }
        .content-wrapper {
            display: flex; /* Flexbox para sidebar y main content */
            flex-grow: 1; /* Permitir que esta área crezca para llenar espacio */
            width: 100%;
        }
        #sidebar {
            width: 250px; /* Ancho fijo de la barra lateral */
            flex-shrink: 0; /* Evitar que la barra lateral se encoja */
            /* Ocultar en pantallas pequeñas - Tailwind: hidden md:block */
        }
        #main-content {
            flex-grow: 1; /* El contenido principal ocupa el espacio restante */
            overflow-y: auto; /* Permitir scroll vertical si es necesario */
        }
        .marker {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: rgba(255, 0, 0, 0.7);
            border: 2px solid white;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10; /* Asegurar que esté sobre la imagen */
        }
        .marker:hover {
            transform: scale(1.3);
            background-color: rgba(255, 0, 0, 1);
        }
        .image-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            margin: auto;
            overflow: hidden;
            border-radius: 0.5rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .image-container img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 0.5rem;
        }
        #panorama-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.8);
            padding-top: 20px;
        }
        .modal-content {
            position: relative;
            background-color: #fefefe;
            margin: auto;
            padding: 20px;
            border: 1px solid #888;
            width: 90%;
            max-width: 1200px;
            height: 90vh;
            max-height: 800px;
            border-radius: 0.5rem;
            display: flex;
            flex-direction: column;
        }
        #panorama {
            width: 100%;
            flex-grow: 1;
            border-radius: 0.375rem;
            background-color: #eee;
        }
        .close-button {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
        }
        .close-button:hover,
        .close-button:focus {
            color: black;
            text-decoration: none;
        }
        #location-title {
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.25rem;
            font-weight: bold;
        }
        /* Estilos para la barra lateral */
        .week-link {
            display: block;
            padding: 0.75rem 1rem; /* py-3 px-4 */
            border-radius: 0.375rem; /* rounded-md */
            transition: background-color 0.2s ease, color 0.2s ease;
            cursor: pointer;
            margin-bottom: 0.5rem; /* mb-2 */
            font-weight: 500; /* medium */
        }
        .week-link:hover {
            background-color: #e5e7eb; /* hover:bg-gray-200 */
            color: #1f2937; /* hover:text-gray-800 */
        }
        .week-link.active {
            background-color: #3b82f6; /* bg-blue-600 */
            color: white; /* text-white */
            font-weight: bold; /* font-bold */
        }

        /* Responsive: Ocultar sidebar en pantallas pequeñas y mostrar un botón (opcional, no implementado aquí) */
        @media (max-width: 768px) { /* Corresponde a 'md:' en Tailwind */
             .content-wrapper {
                flex-direction: column; /* Apilar sidebar y contenido en móvil */
            }
            #sidebar {
                width: 100%; /* Sidebar ocupa todo el ancho */
                margin-bottom: 1rem; /* Espacio debajo del sidebar */
                max-height: 200px; /* Limitar altura y permitir scroll */
                overflow-y: auto;
            }
             #main-content {
                 padding-left: 0; /* Quitar padding izquierdo en móvil */
             }
        }

    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <header class="text-center py-6 bg-white shadow-md w-full">
        <h1 class="text-3xl md:text-4xl font-bold text-blue-700">Seguimiento de Avance Semanal - Proyecto XYZ</h1>
        <p class="text-lg text-gray-600 mt-1">Vista aérea y puntos de inspección 360</p>
    </header>

    <div class="content-wrapper p-4 md:p-8">

        <aside id="sidebar" class="bg-white p-4 rounded-lg shadow-md mr-0 md:mr-8 mb-4 md:mb-0">
            <h2 class="text-xl font-bold mb-4 text-gray-700 border-b pb-2">Semanas de Avance</h2>
            <nav>
                <ul id="week-list">
                    <li class="text-gray-500">Cargando semanas...</li>
                </ul>
            </nav>
        </aside>

        <main id="main-content">
            <div class="image-container" id="main-image-container">
                <img src="https://placehold.co/1000x600/cccccc/ffffff?text=Cargando+Vista+A%C3%A9rea..."
                     alt="Vista aérea de la construcción"
                     onerror="this.onerror=null; this.src='https://placehold.co/1000x600/cccccc/ffffff?text=Error+al+cargar+imagen';"
                     id="main-image">
                </div>

            <div class="text-center mt-6 text-gray-500 text-sm">
                Selecciona una semana en la barra lateral y haz clic en los puntos rojos para ver la imagen 360.
            </div>
        </main>

    </div>

    <div id="panorama-modal">
        <div class="modal-content">
            <span class="close-button" id="close-modal-button">&times;</span>
            <h2 id="location-title">Ubicación</h2>
            <div id="panorama"></div>
        </div>
    </div>

    <footer class="text-center py-4 mt-auto bg-gray-200 text-gray-600 text-sm w-full">
        <p>&copy; 2025 Nombre de tu Empresa. Todos los derechos reservados.</p>
    </footer>

    <script>
        // --- Elementos del DOM ---
        const sidebar = document.getElementById('sidebar');
        const weekList = document.getElementById('week-list');
        const mainImageContainer = document.getElementById('main-image-container');
        const mainImage = document.getElementById('main-image');
        const panoramaModal = document.getElementById('panorama-modal');
        const panoramaContainer = document.getElementById('panorama');
        const closeModalButton = document.getElementById('close-modal-button');
        const locationTitle = document.getElementById('location-title');
        let panoramaViewer = null;
        let currentMarkersData = []; // Almacena los marcadores de la semana actual

        // --- Datos Semanales ---
        // Define aquí los datos para cada semana.
        // IMPORTANTE: Reemplaza las URLs de ejemplo con las tuyas.
        const weeklyData = [
            {
                week: "Semana 1 (01-07 Mayo)",
                mainImageUrl: "https://placehold.co/1000x600/AABBCC/ffffff?text=Vista+Semana+1",
                markersData: [
                    { top: '15%', left: '25%', name: 'S1 - Zona Excavación', panoramaUrl: 'https://pannellum.org/images/alma.jpg' },
                    { top: '50%', left: '50%', name: 'S1 - Cimientos Centrales', panoramaUrl: 'https://pannellum.org/images/cerro-toco-0.jpg' },
                ]
            },
            {
                week: "Semana 2 (08-14 Mayo)",
                mainImageUrl: "https://placehold.co/1000x600/6688AA/ffffff?text=Vista+Semana+2",
                markersData: [
                    { top: '18%', left: '28%', name: 'S2 - Avance Excavación', panoramaUrl: 'https://pannellum.org/images/cerro-toco-0.jpg' }, // Reusamos para ejemplo
                    { top: '55%', left: '52%', name: 'S2 - Encofrado Pilares', panoramaUrl: 'https://pannellum.org/images/from-tree.jpg' },
                    { top: '75%', left: '70%', name: 'S2 - Acceso Sur', panoramaUrl: 'https://placehold.co/2048x1024/aabb99/ffffff?text=Panorama+S2+Acceso' }
                ]
            },
            {
                week: "Semana 3 (15-21 Mayo)",
                mainImageUrl: "https://placehold.co/1000x600/99AA77/ffffff?text=Vista+Semana+3",
                markersData: [
                     { top: '20%', left: '30%', name: 'S3 - Estructura Nivel 1', panoramaUrl: 'https://pannellum.org/images/from-tree.jpg' }, // Reusamos para ejemplo
                     { top: '60%', left: '55%', name: 'S3 - Vaciado Hormigón', panoramaUrl: 'https://pannellum.org/images/alma.jpg' }, // Reusamos para ejemplo
                     { top: '80%', left: '75%', name: 'S3 - Almacén Materiales', panoramaUrl: 'https://placehold.co/2048x1024/ccaa88/ffffff?text=Panorama+S3+Almacen' }
                ]
            }
            // Añade más semanas según sea necesario
        ];

        // --- Funciones ---

        // Función para crear y añadir los marcadores a la imagen
        function createMarkers(markers) {
            // Limpiar marcadores existentes
            mainImageContainer.querySelectorAll('.marker').forEach(marker => marker.remove());

            if (!markers || markers.length === 0) {
                console.log("No hay marcadores para esta semana.");
                return; // Salir si no hay marcadores
            }

            markers.forEach(data => {
                const marker = document.createElement('div');
                marker.classList.add('marker');
                marker.style.top = data.top;
                marker.style.left = data.left;
                marker.dataset.name = data.name;
                marker.dataset.panoramaUrl = data.panoramaUrl;

                marker.addEventListener('click', (event) => {
                    event.stopPropagation(); // Evitar que el clic se propague a elementos padres
                    openPanorama(data.name, data.panoramaUrl);
                });

                mainImageContainer.appendChild(marker);
            });
        }

        // Función para abrir el modal y mostrar el panorama
        function openPanorama(name, url) {
            locationTitle.textContent = name;
            panoramaModal.style.display = 'block';

            if (panoramaViewer) {
                try { panoramaViewer.destroy(); } catch (e) { console.warn("Error destroying previous Pannellum instance:", e); }
                panoramaViewer = null;
            }
            panoramaContainer.innerHTML = ''; // Limpiar

            if (url.startsWith('https://placehold.co')) {
                panoramaContainer.innerHTML = `<div class="flex items-center justify-center h-full text-gray-500 text-xl">Vista 360 no disponible (Placeholder)</div>`;
                console.warn(`Placeholder usado para: ${name}. No se cargará Pannellum.`);
            } else {
                try {
                    panoramaViewer = pannellum.viewer('panorama', {
                        "type": "equirectangular",
                        "panorama": url,
                        "autoLoad": true,
                        "autoRotate": -2,
                        "showZoomCtrl": true,
                        "showFullscreenCtrl": true,
                        "compass": true,
                        "strings": {
                            "loadButtonLabel": "Clic para Cargar", "loadingLabel": "Cargando...",
                            "zoomInLabel": "Acercar", "zoomOutLabel": "Alejar",
                            "fullscreenLabel": "Pantalla Completa", "closeFullscreenLabel": "Salir Pantalla Completa",
                            "compassLabel": "Brújula", "noPanoramaError": "No se pudo cargar la imagen panorámica.",
                            "fileAccessError": "El navegador no permite acceder a archivos locales.",
                            "malformedURLError": "Hay un problema con la URL del panorama.",
                            "networkError": "Ocurrió un error de red al cargar el panorama.",
                            "unknownError": "Ocurrió un error desconocido al cargar el panorama."
                        }
                    });
                    panoramaViewer.on('error', (err) => {
                        console.error("Pannellum error:", err);
                        panoramaContainer.innerHTML = `<div class="flex items-center justify-center h-full text-red-500 text-xl">Error al cargar la vista 360: ${err}</div>`;
                    });
                } catch (e) {
                     console.error("Error initializing Pannellum:", e);
                     panoramaContainer.innerHTML = `<div class="flex items-center justify-center h-full text-red-500 text-xl">Error al inicializar el visor 360.</div>`;
                }
            }
             // Forzar redimensionamiento después de un breve instante
             setTimeout(() => {
                if (panoramaViewer && typeof panoramaViewer.resize === 'function') {
                    panoramaViewer.resize();
                }
            }, 100);
        }

        // Función para cerrar el modal
        function closeModal() {
            panoramaModal.style.display = 'none';
            if (panoramaViewer) {
                try { panoramaViewer.destroy(); } catch (e) { console.warn("Error destroying Pannellum instance on close:", e); }
                panoramaViewer = null;
            }
            panoramaContainer.innerHTML = '';
        }

        // Función para cargar los datos de una semana específica
        function loadWeekData(weekIndex) {
            if (weekIndex < 0 || weekIndex >= weeklyData.length) {
                console.error("Índice de semana inválido:", weekIndex);
                return;
            }

            const data = weeklyData[weekIndex];
            console.log(`Cargando datos para: ${data.week}`);

            // Actualizar imagen principal
            mainImage.src = data.mainImageUrl;
            mainImage.alt = `Vista aérea de la construcción - ${data.week}`; // Actualizar alt text

            // Actualizar marcadores
            currentMarkersData = data.markersData; // Guardar los marcadores actuales
            createMarkers(currentMarkersData);

            // Actualizar el enlace activo en la barra lateral
            updateActiveWeekLink(weekIndex);

            // Cerrar el modal si está abierto al cambiar de semana
            if (panoramaModal.style.display === 'block') {
                closeModal();
            }
        }

        // Función para actualizar visualmente el enlace activo en la barra lateral
        function updateActiveWeekLink(activeIndex) {
            const links = weekList.querySelectorAll('.week-link');
            links.forEach((link, index) => {
                if (index === activeIndex) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        }

        // Función para generar los enlaces de las semanas en la barra lateral
        function populateWeekList() {
            weekList.innerHTML = ''; // Limpiar contenido inicial (ej. "Cargando...")
            if (weeklyData.length === 0) {
                 weekList.innerHTML = '<li class="text-gray-500">No hay datos semanales disponibles.</li>';
                 return;
            }

            weeklyData.forEach((weekData, index) => {
                const li = document.createElement('li');
                const a = document.createElement('a'); // Usar 'a' aunque no navegue, para semántica y estilo
                a.classList.add('week-link');
                a.textContent = weekData.week;
                a.href = "#"; // Evitar navegación real
                a.dataset.weekIndex = index; // Guardar índice para referencia

                a.addEventListener('click', (event) => {
                    event.preventDefault(); // Prevenir el comportamiento por defecto del enlace '#'
                    const selectedIndex = parseInt(event.target.dataset.weekIndex, 10);
                    loadWeekData(selectedIndex);
                });

                li.appendChild(a);
                weekList.appendChild(li);
            });
        }


        // --- Inicialización y Event Listeners ---

        // Generar la lista de semanas y cargar los datos de la primera semana (o la última) al cargar la página
        window.addEventListener('load', () => {
            populateWeekList();
            // Cargar la última semana por defecto (o la primera si prefieres: índice 0)
            const initialWeekIndex = weeklyData.length > 0 ? weeklyData.length - 1 : -1;
            if (initialWeekIndex !== -1) {
                loadWeekData(initialWeekIndex);
            } else {
                 // Manejar caso sin datos: mostrar mensaje o imagen por defecto
                 mainImage.src = 'https://placehold.co/1000x600/cccccc/ffffff?text=Sin+Datos+Semanales';
                 mainImage.alt = 'No hay datos semanales disponibles';
                 createMarkers([]); // Limpiar marcadores
            }
        });

        // Listener para redimensionamiento (ajusta Pannellum si está abierto)
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                 if (panoramaModal.style.display === 'block' && panoramaViewer && typeof panoramaViewer.resize === 'function') {
                    panoramaViewer.resize();
                }
            }, 250);
        });

        // Listeners para cerrar el modal
        closeModalButton.addEventListener('click', closeModal);
        window.addEventListener('click', (event) => {
            if (event.target === panoramaModal) {
                closeModal();
            }
        });
        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && panoramaModal.style.display === 'block') {
                closeModal();
            }
        });

    </script>

</body>
</html>
